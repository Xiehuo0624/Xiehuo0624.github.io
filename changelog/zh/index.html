<!DOCTYPE html>
<html lang="zh" data-lang="zh" data-lang-fixed>
<head>
<meta charset="UTF-8">
<base href="/">
<!-- 语言必须在首次绘制前定下来，否则默认中文文案会一闪而过（defer 脚本来不及）。
     ?lang= > localStorage > 默认 en，与 js/i18n.js 的优先级一致。
     必须是同步内联脚本：改成 src 或 defer 都会让这一闪回来。 -->
<script>
/* 生成页：语言由路径写死，只保留「中文界面才预载中日韩字体」这一条性能决策。
   预载 URL 由 mainFontHref() 从 css/base.css 现读，不在这里硬编码版本号。 */
(function(){try{if(document.documentElement.dataset.lang!=='zh')return;var f=document.createElement('link');f.rel='preload';f.as='font';f.type='font/woff2';f.crossOrigin='anonymous';f.href='/css/fonts/SourceHanSansSC-Regular.woff2?v=15a961bb';document.head.appendChild(f);}catch(e){}})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- 旧地址：这一页的规范地址已经是目录式（/changelog/ 与 /changelog/zh/ 等，由 scripts/gen-pages.mjs 生成）。
     本文件继续可用 —— 已发出去的链接不能断 —— 但静态的 noindex 让不跑 JS 的抓取者知道
     它不是正式页面；页面脚本再用 App.injectCanonical() 补一条指向目录式地址的 canonical。 -->
<meta name="robots" content="noindex,follow">
<title>进程日志</title>
<meta name="description" content="本站与作品本身的带日期进程日志，含每处改动的原因。">
<link rel="canonical" href="https://caohaoxuan.com/changelog/zh/">
<link rel="alternate" hreflang="en" href="https://caohaoxuan.com/changelog/">
<link rel="alternate" hreflang="zh" href="https://caohaoxuan.com/changelog/zh/">
<link rel="alternate" hreflang="x-default" href="https://caohaoxuan.com/changelog/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="泻火 曹浩轩">
<meta property="og:title" content="进程日志">
<meta property="og:description" content="本站与作品本身的带日期进程日志，含每处改动的原因。">
<meta property="og:url" content="https://caohaoxuan.com/changelog/zh/">
<meta property="og:image" content="https://caohaoxuan.com/img/riverrun.webp">
<meta property="og:locale" content="zh_CN">
<meta property="og:locale:alternate" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.ico?v=1" sizes="any">
<link rel="icon" href="img/logo/shuihuo.svg?v=1" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/logo/shuihuo-180.png?v=1">
<link rel="stylesheet" href="css/base.css?v=12">
<link rel="stylesheet" href="css/nav.css?v=3">
<link rel="stylesheet" href="css/changelog.css">
<!-- 中日韩字体只在中文界面才需要（英文全站走 PlainZero / DejaVu Sans Mono，
     用不到 SourceHanSansSC）。它的 Regular + Bold 合计 599KB，无条件 preload
     等于让每个英文读者白等半兆字节，所以改由上面的内联脚本按语言条件注入。
     不带 fetchpriority=high：相当于排队等下载，不跟 CSS / 首屏图片抢带宽。 -->
<!-- 渲染关键：App 命名空间与本页文案数据必须在首次绘制前就位，
     文件末尾那段同步内联脚本要靠 App.CHANGELOG_I18N 在绘制前定下标题文案。
     js/changelog.js 有 188KB，defer 链走完前英文界面会一直显示 HTML 里硬编码的中文
     「进程日志」—— 实测 1838ms，是全站最久的一处首屏语言闪烁。
     两个文件共约 0.9KB，与 CSS 并行下载，实测首屏时刻无回归。 -->
<script src="js/app.js"></script>
<script src="js/changelog-i18n.js"></script>
<!-- core（defer：并行下载、按序执行、不阻塞渲染） -->
<script defer src="js/i18n.js?v=6"></script>
<script defer src="js/autospace.js"></script>
<script defer src="js/nav.js?v=6"></script>
<script defer src="js/prefetch.js"></script>
<!-- page data + logic -->
<script defer src="js/changelog.js?v=23"></script>
</head>
<body>

<div class="back" data-baked="1"><a href="./zh/" data-i18n="back">[&lt;- 返回]</a><a href="#" id="lang-toggle" data-i18n="langToggle">[en] English</a></div>

<div class="changelog-page">
  <div class="timeline"></div>
  <h1 class="changelog-title" data-i18n="title">进程日志</h1>
</div>

<!-- 绘制前定文案的内联脚本已由生成器删除：文案在生成时按语言烤好，不需要运行时再定 -->

</body>
</html>

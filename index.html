<!-- ===== 首页 = 英文规范地址 =====
     2026-09-22 起首页也走「语言写在路径里」：英文在 /（本文件），中文在 /zh/
     （由 scripts/gen-pages.mjs 从本文件生成）。所以本页语言**写死为 en**、不吃 localStorage ——
     否则同一个 / 会因访问者的偏好显示不同语言，分享出去的链接无法预期。
     旧链接 /?lang=zh 仍可用：下面的兼容脚本把它跳到 /zh/。 -->
<!-- gen:legacy-only:lang -->
<script>
/* 旧地址兼容：/?lang=zh → /zh/。本区块只在本文件生效，生成页（/zh/）会换成写死语言的版本。 */
(function(){try{if(new URLSearchParams(location.search).get('lang')==='zh')location.replace('/zh/');}catch(e){}})();
</script>
<!-- /gen:legacy-only:lang -->

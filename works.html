<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<!-- 语言必须在首次绘制前定下来，否则默认中文文案会一闪而过（defer 脚本来不及）。
     ?lang= > localStorage > 默认 en，与 js/i18n.js 的优先级一致。
     必须是同步内联脚本：改成 src 或 defer 都会让这一闪回来。 -->
<!-- gen:legacy-only:lang -->
<script>
(function(){try{var p=new URLSearchParams(location.search).get('lang');var l=(p==='zh'||p==='en')?p:(localStorage.getItem('lang')||'en');if(l!=='zh'&&l!=='en')l='en';document.documentElement.dataset.lang=l;document.documentElement.lang=l;if(l==='zh'){var f=document.createElement('link');f.rel='preload';f.as='font';f.type='font/woff2';f.crossOrigin='anonymous';f.href='css/fonts/SourceHanSansSC-Regular.woff2?v=e69d69e6';document.head.appendChild(f);}}catch(e){}})();
</script>
<!-- /gen:legacy-only:lang -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- 旧地址：这一页的规范地址已经是目录式（/works/ 与 /works/zh/ 等，由 scripts/gen-pages.mjs 生成）。
     本文件继续可用 —— 已发出去的链接不能断 —— 但静态的 noindex 让不跑 JS 的抓取者知道
     它不是正式页面；页面脚本再用 App.injectCanonical() 补一条指向目录式地址的 canonical。 -->
<meta name="robots" content="noindex,follow">
<title>WORKS</title>
<link rel="icon" href="favicon.ico?v=1" sizes="any">
<link rel="icon" href="img/logo/shuihuo.svg?v=1" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/logo/shuihuo-180.png?v=1">
<link rel="stylesheet" href="css/base.css?v=17">
<link rel="stylesheet" href="css/nav.css?v=3">
<link rel="stylesheet" href="css/works.css">
<!-- 中日韩字体只在中文界面才需要（英文全站走 PlainZero / DejaVu Sans Mono，
     用不到 SourceHanSansSC）。它的 Regular + Bold 合计 599KB，无条件 preload
     等于让每个英文读者白等半兆字节，所以改由上面的内联脚本按语言条件注入。
     不带 fetchpriority=high：相当于排队等下载，不跟 CSS / 首屏图片抢带宽。 -->
<!-- 渲染关键：App 命名空间与本页文案数据必须在首次绘制前就位，
     文件末尾那段同步内联脚本要靠 App.WORKS_I18N 在绘制前定下标题文案
     （defer 要等全部脚本下载完才跑，那之前英文界面会先画出 HTML 里硬编码的中文「作品列表」，
     实测约 150ms）。两个文件共约 0.9KB，与 CSS 并行下载，实测首屏时刻无回归。 -->
<script src="js/app.js"></script>
<script src="js/works-i18n.js"></script>
<!-- core（defer：并行下载、按序执行、不阻塞渲染） -->
<script defer src="js/i18n.js?v=6"></script>
<script defer src="js/autospace.js"></script>
<script defer src="js/nav.js?v=6"></script>
<script defer src="js/prefetch.js"></script>
<!-- page data + logic -->
<script defer src="js/project-data.js?v=4"></script>
<script defer src="js/works.js"></script>
</head>
<body>

<div class="works-page">
  <h1 data-i18n="pageTitle">作品列表</h1>
  <div id="works-list"></div>
</div>

<!-- gen:legacy-only:prepaint -->
<!-- ===== 绘制前定文案：必须在首次绘制前执行 =====
     h1 的文案来自 js/works-i18n.js，而它是 defer —— defer 要等全部脚本下载完才跑，
     那之前浏览器已经把 HTML 里硬编码的中文「作品列表」画在屏幕上了（英文界面实测约 150ms）。
     这段同步内联脚本在解析阶段就按 <html data-lang>（已由 <head> 前置脚本写好）定下文案，
     文案读自 js/works-i18n.js，本文件不重复一份；元素保留 data-i18n，切换语言仍由 apply() 接管。
     失败方向：脚本没跑 = 与改动前完全相同（仍显示 HTML 里的默认中文）。
     刻意不写 document.title：本页静态标题已是英文（默认语言），且 works.js 会按语言重设它。 -->
<script>
(function(){
  var lang = document.documentElement.dataset.lang === 'zh' ? 'zh' : 'en';
  var t = App.WORKS_I18N.pageTitle[lang];
  var h = document.querySelector('[data-i18n="pageTitle"]');
  if (h) h.textContent = t;
})();
</script>
<!-- /gen:legacy-only:prepaint -->

</body>
</html>

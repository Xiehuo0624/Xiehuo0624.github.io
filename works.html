<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<!-- 语言必须在首次绘制前定下来，否则默认中文文案会一闪而过（defer 脚本来不及）。
     ?lang= > localStorage > 默认 en，与 js/i18n.js 的优先级一致。
     必须是同步内联脚本：改成 src 或 defer 都会让这一闪回来。 -->
<script>
(function(){try{var p=new URLSearchParams(location.search).get('lang');var l=(p==='zh'||p==='en')?p:(localStorage.getItem('lang')||'en');if(l!=='zh'&&l!=='en')l='en';document.documentElement.dataset.lang=l;document.documentElement.lang=l;if(l==='zh'){var f=document.createElement('link');f.rel='preload';f.as='font';f.type='font/woff2';f.crossOrigin='anonymous';f.href='css/fonts/SourceHanSansSC-Regular.woff2';document.head.appendChild(f);}}catch(e){}})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WORKS</title>
<link rel="icon" href="favicon.ico?v=1" sizes="any">
<link rel="icon" href="img/logo/shuihuo.svg?v=1" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/logo/shuihuo-180.png?v=1">
<link rel="stylesheet" href="css/base.css?v=1">
<link rel="stylesheet" href="css/nav.css?v=1">
<link rel="stylesheet" href="css/works.css">
<!-- 中日韩字体只在中文界面才需要（英文全站走 PlainZero / DejaVu Sans Mono，
     用不到 SourceHanSansSC）。它的 Regular + Bold 合计 599KB，无条件 preload
     等于让每个英文读者白等半兆字节，所以改由上面的内联脚本按语言条件注入。
     不带 fetchpriority=high：相当于排队等下载，不跟 CSS / 首屏图片抢带宽。 -->
<!-- core（defer：并行下载、按序执行、不阻塞渲染） -->
<script defer src="js/app.js"></script>
<script defer src="js/i18n.js?v=3"></script>
<script defer src="js/i18n-common.js"></script>
<script defer src="js/autospace.js"></script>
<script defer src="js/nav.js?v=2"></script>
<script defer src="js/prefetch.js"></script>
<!-- page data + logic -->
<script defer src="js/project-data.js?v=3"></script>
<script defer src="js/works-i18n.js"></script>
<script defer src="js/works.js"></script>
</head>
<body>

<div class="works-page">
  <h1 data-i18n="pageTitle">作品列表</h1>
  <div id="works-list"></div>
</div>

</body>
</html>
